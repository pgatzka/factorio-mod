[tidy-roboports]
debris-in-range=Debris in range: __1__

[mod-setting-name]
tidy-roboports-max-marked-debris=Maximum marked debris per roboport

[mod-setting-description]
tidy-roboports-max-marked-debris=How many pieces of debris in a roboport's construction range may be marked for deconstruction at once. Debris marked by players counts too; debris the robots cannot remove is skipped and does not count. Roboports without full power mark nothing. 0 turns automatic marking off.

name: Mod checks
run-name: |
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: TEMP changelog script gives the expected result on the runner
        run: |
          echo '[]' > "$RUNNER_TEMP/none.json"
          bash tools/changelog.sh 0.9.0 "$RUNNER_TEMP/none.json" "$RUNNER_TEMP/n.md" 2026-09-01
          bash tools/changelog.sh 1.0.0 .github/ci/tmp/pulls.json "$RUNNER_TEMP/notes.md" 2026-09-19
          tr -d '' < .github/ci/tmp/expected.txt | cmp - changelog.txt
          tr -d '' < .github/ci/tmp/expected-notes.md | cmp - "$RUNNER_TEMP/notes.md"
          rm changelog.txt && echo SAME
      - uses: ./.github/actions/mod-checks

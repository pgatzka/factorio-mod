name: Release
run-name: |
  ${{ github.workflow }}: ${{ inputs.bump }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Releases are made from ${{ github.event.repository.default_branch }}, not from ${{ github.ref_name }}."
          exit 1

      # The default branch only takes changes through pull requests. The release
      # app is a bypass actor of that rule, so its token may push the version commit.
      - name: Get a token for the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(jq -r '.version' info.json)
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=info.json::The version '$current' is not of the form <major>.<minor>.<patch>."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$new" > /dev/null; then
            echo "::error::The tag $new already exists."
            exit 1
          fi

          # Only the version line changes, so the file keeps its formatting.
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]+\"/\1$new\"/" info.json
          if [ "$(jq -r '.version' info.json)" != "$new" ]; then
            echo "::error file=info.json::Could not write version $new."
            exit 1
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $new"

      # One entry per pull request merged since the last release. Pull request
      # titles are lowercased copies of their issue's title, so the issue's own
      # wording is used where the title names one.
      - name: Write the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          since=$(gh release view --json publishedAt --jq '.publishedAt' 2> /dev/null || true)
          search=""
          if [ -n "$since" ]; then search="merged:>$since"; fi
          gh pr list --state merged --base "${{ github.event.repository.default_branch }}" --limit 1000 \
            --search "$search" --json number,title,labels > "$RUNNER_TEMP/merged.json"

          echo '[]' > "$RUNNER_TEMP/pulls.json"
          while IFS= read -r pull; do
            issue=$(jq -r '.title | capture("^#(?<issue>[0-9]+) ").issue // empty' <<< "$pull")
            if [ -n "$issue" ] && title=$(gh issue view "$issue" --json title --jq '.title' 2> /dev/null); then
              pull=$(jq -c --arg title "$title" '.title = $title' <<< "$pull")
            fi
            jq -c --argjson pull "$pull" '. + [$pull]' "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/pulls.tmp"
            mv "$RUNNER_TEMP/pulls.tmp" "$RUNNER_TEMP/pulls.json"
          done < <(jq -c '.[]' "$RUNNER_TEMP/merged.json")

          pwsh -File tools/changelog.ps1 -Version "$VERSION" \
            -PullRequests "$RUNNER_TEMP/pulls.json" -NotesPath "$RUNNER_TEMP/release-notes.md"

      # The commit stays local until the checks have passed: a failing release
      # leaves neither a version change nor a tag behind.
      - name: Commit the release
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/$bot" --jq '.id')+$bot@users.noreply.github.com"
          git add info.json changelog.txt
          git commit --quiet --message "release $VERSION"

      # Builds the package from the release commit and loads it in Factorio, which
      # also has to accept the new changelog; the package it leaves in dist/ is
      # the one that gets released.
      - uses: ./.github/actions/mod-checks

      - name: Record the release on the default branch
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(jq -r '.name' info.json)
          gh release create "$VERSION" "dist/${name}_${VERSION}.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

name: Mod checks
description: >-
  Checks the mod in the checked-out repository: info.json, changelog, Lua syntax, and that
  the release package built from HEAD loads and runs in headless Factorio.
runs:
  using: composite
  steps:
    - name: Check info.json
      shell: bash
      run: |
        jq -e '
          (.name | type == "string" and test("^[A-Za-z0-9_-]+$")) and
          (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
          (.title | type == "string") and
          (.author | type == "string") and
          (.factorio_version | type == "string")
        ' info.json > /dev/null || {
          echo "::error file=info.json::info.json is not valid JSON or lacks a valid name, version, title, author, or factorio_version"
          exit 1
        }

    # Headless Factorio does not read the changelog, so a malformed one would
    # only show up in players' games. Factorio accepts nothing but this format.
    - name: Check changelog.txt
      shell: bash
      run: |
        [ -f changelog.txt ] || exit 0
        version=$(jq -r '.version' info.json)
        awk -v version="$version" '
          function fail(message) {
            printf "::error file=changelog.txt,line=%d::%s\n", NR, message
            failed = 1
          }
          /\r$/ { fail("Line ends with a carriage return."); next }
          /\t/ { fail("Tabs are not allowed.") }
          /[ ]+$/ { fail("Trailing spaces are not allowed.") }
          /^-+$/ {
            if (length($0) != 99) fail("A separator line has exactly 99 dashes.")
            if (state == "category") fail("The category above has no entries.")
            if (state == "version" || state == "date") fail("The version above has no categories.")
            state = "separator"; next
          }
          state == "separator" {
            if ($0 !~ /^Version: [0-9]+\.[0-9]+\.[0-9]+$/) fail("Expected \"Version: <major>.<minor>.<patch>\" after the separator.")
            number = substr($0, 10)
            if (number in seen) fail("Version " number " appears twice.")
            seen[number] = 1
            if (!first) first = number
            state = "version"; next
          }
          state == "version" && /^Date: .+/ { state = "date"; next }
          /^  [A-Z][A-Za-z ]*:$/ && (state == "version" || state == "date" || state == "entry") { state = "category"; next }
          /^    - [^ ]/ && (state == "category" || state == "entry") { state = "entry"; next }
          /^      [^ ]/ && state == "entry" { next }
          { fail("Unexpected line; expected a separator, version, date, category (two spaces, ends with a colon), or entry (four spaces and \"- \").") }
          END {
            if (NR == 0) { print "::error file=changelog.txt::The changelog is empty."; failed = 1 }
            if (state == "category") fail("The last category has no entries.")
            if (state == "separator" || state == "version" || state == "date") fail("The last version has no categories.")
            if (first && first != version) {
              printf "::error file=changelog.txt,line=2::The newest changelog version is %s, but info.json says %s.\n", first, version
              failed = 1
            }
            exit failed
          }
        ' changelog.txt

    - name: Check Lua syntax
      shell: bash
      run: |
        sudo apt-get install --yes --no-install-recommends lua5.2 > /dev/null
        failed=0
        while IFS= read -r file; do
          if ! output=$(luac5.2 -p "$file" 2>&1); then
            # luac reports "luac5.2: <file>:<line>: <message>"
            line=$(echo "$output" | sed -n 's/^[^:]*: [^:]*:\([0-9]*\):.*/\1/p' | head -n 1)
            echo "::error file=$file,line=${line:-1}::$output"
            failed=1
          fi
        done < <(git ls-files '*.lua')
        exit $failed

    - name: Resolve Factorio version
      id: factorio
      shell: bash
      run: |
        version=$(curl --fail --silent --show-error https://factorio.com/api/latest-releases | jq -r '.stable.headless')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore Factorio from cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/factorio
        key: factorio-headless-${{ steps.factorio.outputs.version }}

    - name: Download Factorio
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl --fail --silent --show-error --location \
          "https://factorio.com/get-download/${{ steps.factorio.outputs.version }}/headless/linux64" \
          --output "$RUNNER_TEMP/factorio.tar.xz"
        tar --extract --file "$RUNNER_TEMP/factorio.tar.xz" --directory "$RUNNER_TEMP"

    - name: Set up mods
      shell: bash
      run: |
        name=$(jq -r '.name' info.json)
        mods="$RUNNER_TEMP/mods"
        mkdir -p "$mods/ci-harness"
        # The mod is installed as its release package, so the package gets checked as well.
        bash tools/package.sh
        cp dist/*.zip "$mods/"
        cp .github/ci/harness/* "$mods/ci-harness/"
        # Expansion mods stay off: the mod has to load with the base game alone.
        jq -n --arg name "$name" '{mods: [
          {name: "base", enabled: true},
          {name: "elevated-rails", enabled: false},
          {name: "quality", enabled: false},
          {name: "space-age", enabled: false},
          {name: $name, enabled: true},
          {name: "ci-harness", enabled: true}
        ]}' > "$mods/mod-list.json"

    # Creating a map loads the settings and data stage of all mods and runs
    # on_init; the benchmark then runs the scripts for a while. The harness
    # mod provides a roboport with debris and fails when nothing got marked.
    - name: Load the mod and run its scripts
      shell: bash
      run: |
        factorio="$RUNNER_TEMP/factorio/bin/x64/factorio"
        mods="$RUNNER_TEMP/mods"
        log="$RUNNER_TEMP/factorio.log"
        status=0
        {
          "$factorio" --mod-directory "$mods" --create "$RUNNER_TEMP/check.zip" &&
          "$factorio" --mod-directory "$mods" --benchmark "$RUNNER_TEMP/check.zip" --benchmark-ticks 900
        } > "$log" 2>&1 || status=$?
        cat "$log"

        # Factorio does not always exit with an error when a mod fails, so the log decides as well.
        errors=$(grep -A 8 -E '^ *[0-9]+\.[0-9]+ Error |^Error' "$log" | head -n 30 || true)
        if [ "$status" -ne 0 ] || [ -n "$errors" ]; then
          # Point the report at the mod's file and line when the log names one.
          name=$(jq -r '.name' info.json)
          location=$(echo "$errors" | grep -o "__${name}__/[^:]*:[0-9]*" | head -n 1 || true)
          target=""
          if [ -n "$location" ]; then
            file=${location#__${name}__/}
            target=" file=${file%%:*},line=${file##*:}"
          fi
          message="Factorio reported a problem while loading or running the mod (exit code $status):"$'\n'"$errors"
          # Workflow commands take multi-line messages in this encoding.
          message=${message//'%'/'%25'}
          message=${message//$'\n'/'%0A'}
          echo "::error${target}::${message}"
          exit 1
        fi
        if ! grep -q 'ci-harness: .* marked' "$log"; then
          echo "::error::The scripts did not run to the point where the harness verifies the marked debris."
          exit 1
        fi
